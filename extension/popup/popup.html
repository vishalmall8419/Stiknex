<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stiknex Productivity Tools</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="theme-light">
  <div class="app-container">
    
    <!-- Top Brand Header -->
    <header class="header">
      <div class="brand">
        <img src="../assets/logo.png" alt="Stiknex" class="brand-logo" id="headerLogo">
        <div class="brand-text">
          <span class="brand-name">Stiknex</span>
          <span class="brand-tag">Productivity Suite</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="btnOpenSidePanel" class="icon-btn" title="Open Side Panel for Multi-tasking" aria-label="Open Side Panel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>

        <button id="btnToggleTheme" class="icon-btn" title="Toggle Dark / Light Theme" aria-label="Toggle Theme">
          <svg id="themeIconSun" class="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg id="themeIconMoon" class="theme-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>

        <button id="btnOpenWeb" class="icon-btn" title="Open Stiknex Website (stiknex.site)" aria-label="Open Stiknex Website">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Views Container -->
    <main class="main-content">
      
      <!-- VIEW A: CATALOG & DASHBOARD VIEW -->
      <section id="catalogView" class="view-section active">
        
        <!-- Search & Filter Bar -->
        <div class="search-container">
          <div class="search-wrapper">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="toolSearchInput" placeholder="Search 24 tools (Press '/' to focus)..." autocomplete="off" spellcheck="false">
            <button id="btnClearSearch" class="clear-search-btn hidden" aria-label="Clear search">&times;</button>
          </div>
        </div>

        <!-- Category Nav Pills -->
        <nav class="category-pills" id="categoryPills">
          <button class="pill-btn active" data-cat="all">All Tools</button>
          <button class="pill-btn" data-cat="pinned">⭐ Pinned</button>
          <button class="pill-btn" data-cat="notes">📝 Notes</button>
          <button class="pill-btn" data-cat="writing">✍️ Writing</button>
          <button class="pill-btn" data-cat="calculators">🧮 Math</button>
          <button class="pill-btn" data-cat="converters">🔄 Converters</button>
          <button class="pill-btn" data-cat="utilities">⚡ Utilities</button>
        </nav>

        <!-- Tool Cards List -->
        <div class="tools-list" id="toolsList">
          <!-- Dynamically populated by popup.js -->
        </div>

        <!-- Empty Search State -->
        <div id="searchEmptyState" class="empty-state hidden">
          <div class="empty-icon">🔍</div>
          <h3>No tools found</h3>
          <p>No tools matched your search query. Try another keyword.</p>
        </div>

      </section>

      <!-- VIEW B: ACTIVE TOOL VIEW -->
      <section id="toolDetailView" class="view-section hidden">
        
        <!-- Tool Sub-Header Navigation -->
        <div class="tool-subnav">
          <button id="btnBackToCatalog" class="back-btn" title="Back to tools directory">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="19" y1="12" x2="5" y2="12"/>
              <polyline points="12 19 5 12 12 5"/>
            </svg>
            <span>Tools</span>
          </button>

          <div class="tool-subnav-center">
            <h2 id="activeToolTitle" class="active-tool-title">Tool Name</h2>
            <span id="activeToolCategory" class="active-tool-badge">Category</span>
          </div>

          <div class="tool-subnav-actions">
            <button id="btnTogglePin" class="tool-action-btn" title="Pin / Unpin Tool" aria-label="Pin tool">
              <svg id="starEmpty" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
              </svg>
              <svg id="starFilled" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="#f59e0b" stroke="#f59e0b" stroke-width="2">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
              </svg>
            </button>

            <button id="btnLaunchOnWeb" class="tool-action-btn" title="Open full version on stiknex.site" aria-label="Open on web">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                <polyline points="15 3 21 3 21 9"/>
                <line x1="10" y1="14" x2="21" y2="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Tool Runtime Container -->
        <div id="toolBodyContainer" class="tool-body">
          <!-- Active tool interactive UI renders here -->
        </div>

      </section>

    </main>

    <!-- Bottom Footer Bar -->
    <footer class="footer">
      <div class="footer-links">
        <a href="https://stiknex.site/sticky-notes" target="_blank" rel="noreferrer">Sticky Board</a>
        <span class="dot">•</span>
        <a href="https://stiknex.site/online-notebook" target="_blank" rel="noreferrer">Notebook</a>
        <span class="dot">•</span>
        <a href="https://stiknex.site/whiteboard" target="_blank" rel="noreferrer">Whiteboard</a>
        <span class="dot">•</span>
        <a href="https://stiknex.site/buy-me-a-coffee" target="_blank" rel="noreferrer">Support</a>
      </div>
    </footer>

  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
